<html>

        <title>Experiment 3-Structure a webpage using semantic HTML5 tags.</title>
    </head>
    <body>
        <header>
            <h1>My Semantic HTML5 Page</h1>
        </header>   
        <nav>
                <ul>

                    <li><a href="exp 2.html">Experiment NO. 2</a></li>

        </footer>
